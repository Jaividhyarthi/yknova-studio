<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Auth</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0% 0%,#6c429d,#211a37 45%,#100f20);color:#fff;font-family:system-ui,Arial;display:grid;place-items:center;padding:20px}.card{width:min(100%,425px);border:1px solid #ffffff3a;background:#ffffff14;backdrop-filter:blur(22px);padding:37px;border-radius:22px;box-shadow:0 20px 70px #05041170}.symbol{font-size:43px;color:#d0b5ff}.muted{color:#c4b7d7;font-size:14px}h1{margin:16px 0 6px}label{font-size:13px;display:block;margin:18px 0 8px}input{width:100%;padding:14px 16px;border:1px solid #c4b0d266;border-radius:11px;color:#fff;background:#271b43;outline:0}input:focus{border-color:#e5c7ff}.password{display:flex}.password input{border-radius:11px 0 0 11px}.password button{background:#493469;color:#eee;border:1px solid #c4b0d266;border-radius:0 11px 11px 0;padding:0 14px}.submit{width:100%;background:#dfc0ff;color:#271337;border:0;padding:14px;border-radius:12px;font-weight:800;margin-top:25px;cursor:pointer}.toggle{display:block;color:#e9d0ff;border:0;background:none;margin:18px auto 0;cursor:pointer}.msg{font-size:12px;margin-top:15px;min-height:16px}.ok{color:#c6ffc6}.error{color:#ffd1da}</style></head><body><form class="card" id="form" novalidate><div class="symbol">✧</div><h1 id="heading">Welcome back</h1><p class="muted" id="lead">Sign in to continue your adventure.</p><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><div class="password"><input id="password" type="password" autocomplete="current-password" placeholder="Minimum 8 characters" minlength="8" required><button type="button" id="show" aria-label="Show password">Show</button></div><button type="submit" class="submit" id="submit">Sign in →</button><div class="msg" id="msg" role="status" aria-live="polite"></div><button type="button" class="toggle" id="toggle">New here? Create an account</button></form><script>let signup=false;const q=id=>document.getElementById(id);q('show').onclick=()=>{const p=q('password');p.type=p.type==='password'?'text':'password';q('show').textContent=p.type==='password'?'Show':'Hide'};q('toggle').onclick=()=>{signup=!signup;q('heading').textContent=signup?'Create your account':'Welcome back';q('lead').textContent=signup?'A beautiful beginning starts here.':'Sign in to continue your adventure.';q('submit').textContent=signup?'Create account →':'Sign in →';q('toggle').textContent=signup?'Already registered? Sign in':'New here? Create an account';q('msg').textContent=''};q('form').onsubmit=e=>{e.preventDefault();const valid=q('email').validity.valid&&q('password').value.length>=8;q('msg').className='msg '+(valid?'ok':'error');q('msg').textContent=valid?'Looks great! UI demo only — connect your own authentication backend.':'Enter a valid email and a password of at least 8 characters.'};</script></body></html>
